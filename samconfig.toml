version = 0.1

[default.global.parameters]
stack_name = "heat-shift"
region = "us-east-1"

[default.build.parameters]
# Build inside the Lambda Python 3.11 image so wheels match the runtime (needs Docker running).
use_container = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = false
# Claude Haiku 4.5 through its US inference profile. Change it here, not in the code.
parameter_overrides = "BedrockModelId=us.anthropic.claude-haiku-4-5-20251001-v1:0"

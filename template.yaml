AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Heat-safe shift planner (app hosting, JSON API, planner)

Parameters:
  BedrockModelId:
    Type: String
    Description: Bedrock model ID or inference profile ID for Claude Haiku

Globals:
  Function:
    Runtime: python3.11
    CodeUri: src/
    MemorySize: 512
    Environment:
      Variables:
        SITES_TABLE: !Ref SitesTable
        PLANS_TABLE: !Ref PlansTable
        COOLING_TABLE: !Ref CoolingPointsTable
        AUDIO_BUCKET: !Ref AudioBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        POLLY_VOICE_ID: Kajal
        TZ_NAME: Asia/Kolkata

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The Android app's screens load from https://localhost inside the APK,
      # so its API calls are cross-origin. The web build is same-origin via CloudFront.
      CorsConfiguration:
        AllowOrigins:
          - https://localhost
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
      # The API is public and triggers paid Bedrock calls.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.api.handler
      Timeout: 10
      Environment:
        Variables:
          PLANNER_FUNCTION_NAME: !Ref PlannerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable
        - LambdaInvokePolicy:
            FunctionName: !Ref PlannerFunction
        # Signs time-limited links to the voice notes.
        - S3ReadPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY

  PlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.planner.handler
      # The 06:00 job builds every site one after another; one site takes well under a minute.
      Timeout: 300
      MemorySize: 1024
      # No async retries: a failed run must not build or voice the same plan twice.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable
        - DynamoDBReadPolicy:
            TableName: !Ref CoolingPointsTable
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*'
            # Inference profiles fan out to model ARNs in several regions, hence '*'.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"all_sites": true}'

  SitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE

  CoolingPointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: city
          AttributeType: S
        - AttributeName: point_id
          AttributeType: S
      KeySchema:
        - AttributeName: city
          KeyType: HASH
        - AttributeName: point_id
          KeyType: RANGE

  AudioBucket:
    Type: AWS::S3::Bucket

  # Holds the web build and the APK download; private, read only through CloudFront.
  WebBucket:
    Type: AWS::S3::Bucket

  WebBucketAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # One HTTPS domain for the web build, the APK download and the API.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebBucketAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # managed CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # managed CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # managed AllViewerExceptHostHeader

Outputs:
  AppUrl:
    Description: The app's link; also the value of VITE_API_BASE for the APK build
    Value: !Sub https://${Distribution.DomainName}
  WebBucketName:
    Description: Sync web/dist and the APK here
    Value: !Ref WebBucket
  DistributionId:
    Description: Invalidate this after each web upload
    Value: !Ref Distribution
  CoolingTable:
    Description: Set as COOLING_TABLE for scripts/seed_cooling_points.py
    Value: !Ref CoolingPointsTable
